# ---------------------------------------------------------------------------
# GitHub Actions CI for Go projects
# ---------------------------------------------------------------------------
# Runs on push/PR to main. Pipeline:
#   tidy → build → vet → lint → test (short, race) → deadcode → vulncheck
#   → cross-compile linux/amd64 → upload artifact
#
# Add a `services` block here if your tests need PostgreSQL, Redis, etc.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"

jobs:
  ci:
    name: "Go CI"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true

      - name: Install dev tools
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Tidy
        run: go mod tidy
        env:
          GOPROXY: https://proxy.golang.org,direct

      - name: Build
        run: go build -o /dev/null ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: golangci-lint run ./... --timeout=5m

      - name: Test (short, race, shuffle)
        run: go test -short -race -count=1 -shuffle=on ./...

      - name: Deadcode
        run: deadcode -test ./...

      - name: Vulncheck
        run: govulncheck ./...

      - name: Cross-compile linux/amd64
        run: |
          mkdir -p bin/
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags="-X main.Version=ci -X main.Commit=$(git rev-parse --short HEAD)" \
            -o bin/$(basename $(pwd))-linux-amd64 ./...
          echo "Linux binary: $(ls -lh bin/$(basename $(pwd))-linux-amd64 | awk '{print $5}')"

      - name: Upload linux/amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux-amd64
          path: bin/*-linux-amd64
          retention-days: 3
          if-no-files-found: warn
